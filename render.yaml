# Render Blueprint — Dashboard → New → Blueprint → pick this repo.
# Deploys BOTH the API (Node web service) and the React app (static site) on Render's free plan.
# The database lives on Neon (Render's free Postgres is deleted after 30 days).
services:
  - type: web
    name: soilsense-api
    runtime: node
    plan: free
    region: singapore           # closest Render region to India
    rootDir: backend
    # migrate is a no-op when the schema exists; seed skips when farmers exist → safe on every deploy
    buildCommand: npm ci && npm run db:migrate && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false             # paste the Neon pooled connection string when prompted
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: INGEST_API_KEY
        generateValue: true
      - key: CORS_ORIGINS       # the static site's hostname (https:// is added automatically)
        fromService:
          name: soilsense-web
          type: web
          property: host
      - key: APP_URL
        fromService:
          name: soilsense-web
          type: web
          property: host

  - type: web
    name: soilsense-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite           # SPA: deep links like /app/sensors serve index.html
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL       # API hostname (https:// is added automatically)
        fromService:
          name: soilsense-api
          type: web
          property: host
